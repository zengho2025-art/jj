<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Digest · 外刊精读</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: "#FAF9F5",
                        ink: "#1B3B36",
                        moss: "#2F5D54",
                        sage: "#5C7A74",
                        sand: "#E8E4D9",
                        wheat: "#F3F0E7",
                        gold: "#C4A35A",
                    },
                    fontFamily: {
                        display: ["Playfair Display", "Georgia", "serif"],
                        serif: ["Source Serif 4", "Noto Serif SC", "Georgia", "serif"],
                        sans: ["Source Sans 3", "system-ui", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        body { background-color: #FAF9F5; color: #1B3B36; font-family: 'Source Sans 3', 'Noto Serif SC', serif; }
        /* 单词点击气泡样式 */
        .vocab-word { border-bottom: 1.5px dashed #C4A35A; cursor: pointer; position: relative; }
        .vocab-word:hover { background-color: #F3F0E7; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-moss selection:text-paper">
    <!-- 顶部导航栏 -->
    <header class="border-b border-sand bg-paper/80 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="font-display italic text-2xl font-bold tracking-tight text-ink">Academic Digest</span>
                <span class="text-xs uppercase tracking-widest px-2 py-0.5 bg-wheat text-moss font-semibold rounded">外刊精读</span>
            </div>
            <div class="text-sm text-sage font-medium">www.scopix.cn</div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-5xl mx-auto px-6 py-10 flex-grow w-full">
        <!-- 头部欢迎语 -->
        <div class="mb-10 border-b border-sand pb-6">
            <h1 class="font-display text-4xl font-bold tracking-tight text-ink mb-2">Curated Insights</h1>
            <p class="text-sage text-sm font-sans">深度剖析全球顶级外刊，提炼核心词汇与长难句逻辑结构。</p>
        </div>

        <!-- 动态文章列表容器 -->
        <div id="articles-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 动态渲染数据将注入到这里 -->
            <div class="text-sage text-sm py-10">正在加载外刊文章库...</div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="border-t border-sand py-6 text-center text-xs text-sage font-sans">
        &copy; 2026 Academic Digest · All Rights Reserved. Hosted on Vercel.
    </footer>

    <!-- 前端逻辑与数据加载 -->
    <script>
        async function fetchArticles() {
            try {
                // 异步读取同级目录下的 articles.json
                const response = await fetch('./articles.json');
                if (!response.ok) throw new Error("无法加载文章数据文件");
                const articles = await response.json();
                renderArticles(articles);
            } catch (error) {
                document.getElementById('articles-container').innerHTML = `
                    <div class="col-span-2 p-6 bg-red-50 border border-red-200 text-red-700 rounded text-sm">
                        加载文章库失败: ${error.message}。请确保同级目录下存在 <code>articles.json</code> 文件。
                    </div>
                `;
            }
        }

        function renderArticles(articles) {
            const container = document.getElementById('articles-container');
            if (!articles || articles.length === 0) {
                container.innerHTML = '<div class="text-sage">暂无文章，请在 articles.json 中添加。</div>';
                return;
            }

            container.innerHTML = articles.map(item => `
                <article class="bg-white border border-sand p-6 rounded-lg shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between text-xs text-sage mb-3 font-sans uppercase tracking-wider">
                            <span class="bg-wheat px-2 py-0.5 rounded text-moss font-semibold">${item.category}</span>
                            <span>${item.date}</span>
                        </div>
                        <h2 class="font-display text-xl font-bold text-ink mb-1 leading-snug">${item.title}</h2>
                        <h3 class="text-sm text-sage font-serif mb-4">${item.chineseTitle}</h3>
                        <p class="text-sm text-gray-600 line-clamp-3 mb-4 font-serif">${item.summary || "点击阅读完整段落与精读解析..."}</p>
                    </div>
                    <div class="pt-4 border-t border-sand/60 flex items-center justify-between text-xs text-moss font-sans font-semibold">
                        <span>包含 ${item.paragraphs ? item.paragraphs.length : 0} 个精读段落</span>
                        <span class="hover:underline cursor-pointer">阅读解析 &rarr;</span>
                    </div>
                </article>
            `).join('');
        }

        // 页面加载完毕后执行加载
        window.addEventListener('DOMContentLoaded', fetchArticles);
    </script>
</body>
</html>
