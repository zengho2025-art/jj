<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Digest · 外刊精读</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: "#FAF9F5",
                        ink: "#1B3B36",
                        moss: "#2F5D54",
                        sage: "#5C7A74",
                        sand: "#E8E4D9",
                        wheat: "#F3F0E7",
                        gold: "#C4A35A",
                    },
                    fontFamily: {
                        display: ["Playfair Display", "Georgia", "serif"],
                        serif: ["Source Serif 4", "Noto Serif SC", "Georgia", "serif"],
                        sans: ["Source Sans 3", "system-ui", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        body { background-color: #FAF9F5; color: #1B3B36; font-family: 'Source Sans 3', 'Noto Serif SC', serif; }
        .token-item {
            position: relative;
            display: inline-block;
            cursor: pointer;
            border-bottom: 1.5px dashed #C4A35A;
            margin-right: 4px;
            margin-bottom: 4px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .token-item .tooltip-text {
            display: none;
            width: max-content;
            max-width: 320px;
            background-color: #1B3B36;
            color: #FAF9F5;
            text-align: left;
            border-radius: 8px;
            padding: 12px 14px;
            position: absolute;
            z-index: 50;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            line-height: 1.5;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        @media (hover: hover) and (pointer: fine) {
            .token-item:hover { background-color: #F3F0E7; border-bottom: 2px solid #2F5D54; }
            .token-item:hover .tooltip-text { display: block; }
        }
        .token-item.is-open { background-color: #F3F0E7; border-bottom: 2px solid #2F5D54; }
        .token-item.is-open .tooltip-text { display: block !important; }
        .dict-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(27, 59, 54, 0.45);
            backdrop-filter: blur(3px);
            z-index: 100;
            align-items: flex-end;
            justify-content: center;
        }
        .dict-modal-overlay.active { display: flex; }
        .dict-modal-content {
            background-color: #FAF9F5;
            color: #1B3B36;
            width: 100%;
            max-width: 620px;
            max-height: 80vh;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.25);
            overflow-y: auto;
        }
        @media (min-width: 768px) {
            .dict-modal-overlay { align-items: center; }
            .dict-modal-content { border-radius: 16px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <header class="border-b border-sand bg-paper/80 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <span class="font-display italic text-2xl font-bold tracking-tight text-ink">Academic Digest</span>
            <div class="text-sm text-sage font-medium">www.scopix.cn</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10 flex-grow w-full">
        <div id="article-container"></div>
    </main>

    <!-- 词典弹窗 -->
    <div id="dictModal" class="dict-modal-overlay" onclick="closeDictModal()">
        <div class="dict-modal-content" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between pb-3 border-b border-sand">
                <span id="dictWord" class="font-display text-2xl font-bold text-ink">Word</span>
                <button type="button" onclick="closeDictModal()" class="w-8 h-8 rounded-full bg-sand/50 flex items-center justify-center text-xl font-bold">&times;</button>
            </div>
            <div id="dictBody" class="mt-4 space-y-4 text-sm leading-relaxed"></div>
        </div>
    </div>

    <script>
        // 核心交互：点击展开/收起气泡
        function toggleToken(e, el) {
            e.stopPropagation();
            const isOpen = el.classList.contains('is-open');
            document.querySelectorAll('.token-item.is-open').forEach(item => item.classList.remove('is-open'));
            if (!isOpen) el.classList.add('is-open');
        }

        // 双击或长按查询词典
        function lookupWord(word) {
            const modal = document.getElementById('dictModal');
            document.getElementById('dictWord').innerText = word;
            document.getElementById('dictBody').innerHTML = '<div class="text-sage py-4 text-center">正在检索中英权威词典...</div>';
            modal.classList.add('active');

            fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh`)
                .then(r => r.json())
                .then(data => {
                    const trans = data.responseData.translatedText;
                    document.getElementById('dictBody').innerHTML = `
                        <div class="bg-wheat/70 border border-gold/40 p-4 rounded-lg">
                            <div class="text-xs text-gold font-bold mb-1">中文常用含义</div>
                            <div class="text-lg font-bold text-ink">${trans}</div>
                        </div>
                    `;
                }).catch(() => {
                    document.getElementById('dictBody').innerHTML = '<div class="text-sage text-center">查询暂不可用</div>';
                });
        }

        function closeDictModal() {
            document.getElementById('dictModal').classList.remove('active');
        }

        // 点击页面空白处关闭所有气泡
        document.addEventListener('click', () => {
            document.querySelectorAll('.token-item.is-open').forEach(item => item.classList.remove('is-open'));
        });

        // 尝试自动读取 articles.json，若本地拦截则自动渲染离线数据
        fetch('articles.json')
            .then(res => res.json())
            .then(renderArticles)
            .catch(() => {
                console.warn("未通过 Web Server 打开，已切换至内置离线演示数据");
                // 自动演示第一段
                renderArticles([{
                    title: "The Baby and the Bathtub: AI, Science, and the Crisis of Understanding",
                    paragraphs: [{
                        paragraphTitle: "第一段：引子与背景段",
                        englishText: "October 6th, 2026, may be hailed as the most significant turning point in mathematics.",
                        chineseText: "2026年10月6日，可能会被奉为数学史上最重要的转折点。",
                        wordTokens: [
                            { word: "October 6th, 2026,", role: "时间状语", meaning: "特定时间点", etymology: "源自拉丁语 octo (八)" },
                            { word: "may be hailed as", role: "谓语", meaning: "被誉为/被奉为", etymology: "源自古诺斯语 heill (健全、欢呼赞扬)" },
                            { word: "the most significant turning point", role: "宾补", meaning: "最重要的转折点", etymology: "源自拉丁语 signum (标志)" },
                            { word: "in mathematics.", role: "后置定语", meaning: "在数学领域", etymology: "源自希腊语 mathema (科学知识)" }
                        ]
                    }]
                }]);
            });

        function renderArticles(data) {
            const art = data[0];
            const html = `
                <div class="bg-white border border-sand rounded-xl p-8 shadow-sm">
                    <h1 class="font-display text-3xl font-bold text-ink mb-6">${art.title}</h1>
                    ${art.paragraphs.map(p => `
                        <div class="mb-8 p-6 bg-paper/50 border border-sand rounded-xl">
                            <h3 class="font-bold text-moss mb-3">${p.paragraphTitle}</h3>
                            <div class="text-lg leading-relaxed mb-3">
                                ${p.wordTokens ? p.wordTokens.map(t => `
                                    <span class="token-item" onclick="toggleToken(event, this)" ondblclick="lookupWord('${t.word}')">
                                        ${t.word}
                                        <span class="tooltip-text">
                                            <div><strong class="text-gold">成分：</strong>${t.role}</div>
                                            <div><strong class="text-sand">释义：</strong>${t.meaning}</div>
                                            ${t.etymology ? `<div class="mt-1 pt-1 border-t border-sand/20 text-gold/90 text-xs">🌱 词源：${t.etymology}</div>` : ''}
                                        </span>
                                    </span>
                                `).join(' ') : p.englishText}
                            </div>
                            <div class="text-gray-600 text-sm">${p.chineseText}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('article-container').innerHTML = html;
        }
    </script>
</body>
</html>
