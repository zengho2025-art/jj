<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Digest · 外刊精读</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: "#FAF9F5",
                        ink: "#1B3B36",
                        moss: "#2F5D54",
                        sage: "#5C7A74",
                        sand: "#E8E4D9",
                        wheat: "#F3F0E7",
                        gold: "#C4A35A",
                    },
                    fontFamily: {
                        display: ["Playfair Display", "Georgia", "serif"],
                        serif: ["Source Serif 4", "Noto Serif SC", "Georgia", "serif"],
                        sans: ["Source Sans 3", "system-ui", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        body { background-color: #FAF9F5; color: #1B3B36; font-family: 'Source Sans 3', 'Noto Serif SC', serif; }
        .category-btn.active { background-color: #2F5D54; color: #FAF9F5; }

        /* 单词/短语悬浮提示样式 (Tooltip) */
        .token-item {
            position: relative;
            display: inline-block;
            cursor: pointer;
            border-bottom: 1.5px dashed #C4A35A;
            margin-right: 4px;
            margin-bottom: 4px;
            transition: background-color 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .token-item:hover,
        .token-item.active {
            background-color: #F3F0E7;
            border-bottom: 2px solid #2F5D54;
        }
        /* 气泡本体 */
        .token-item .tooltip-text {
            visibility: hidden;
            width: max-content;
            max-width: 280px;
            background-color: #1B3B36;
            color: #FAF9F5;
            text-align: left;
            border-radius: 6px;
            padding: 10px 14px;
            position: absolute;
            z-index: 50;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 0.75rem;
            font-family: 'Source Sans 3', sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            line-height: 1.5;
            pointer-events: auto;
        }
        /* PC 端悬浮或移动端点击激活时均可见 */
        .token-item:hover .tooltip-text,
        .token-item.active .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-moss selection:text-paper">
    <!-- 顶部导航栏 -->
    <header class="border-b border-sand bg-paper/80 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <span class="font-display italic text-2xl font-bold tracking-tight text-ink">Academic Digest</span>
                <span class="text-xs uppercase tracking-widest px-2 py-0.5 bg-wheat text-moss font-semibold rounded">外刊精读</span>
            </div>
            <div class="text-sm text-sage font-medium">www.scopix.cn</div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full">
        <div id="app-view">
            <div class="text-sage text-sm py-10">正在加载外刊文章库...</div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="border-t border-sand py-6 text-center text-xs text-sage font-sans">
        &copy; 2026 Academic Digest · All Rights Reserved. Hosted on Vercel.
    </footer>

    <!-- 核心业务逻辑 -->
    <script>
        let allArticles = [];
        let currentCategory = 'All';

        async function initApp() {
            try {
                // 动态拉取同目录下的 articles.json（加入时间戳避免浏览器缓存旧文件）
                const response = await fetch('articles.json?t=' + new Date().getTime());
                if (!response.ok) {
                    throw new Error(`无法读取 articles.json (状态码: ${response.status})`);
                }
                allArticles = await response.json();
                checkRoute();
            } catch (error) {
                console.error("加载失败:", error);
                document.getElementById('app-view').innerHTML = `
                    <div class="p-6 bg-red-50 border border-red-200 text-red-700 rounded text-sm space-y-2">
                        <p class="font-bold">文章库 articles.json 加载失败</p>
                        <p>错误原因: ${error.message}</p>
                        <p class="text-xs text-gray-500">提示：若直接双击打开 HTML 文件（file:// 协议），浏览器会因安全限制阻止读取 JSON。请将其部署到 Vercel/GitHub Pages，或使用 VS Code Live Server 预览。</p>
                    </div>
                `;
            }
        }

        function checkRoute() {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id');
            if (articleId) {
                const article = allArticles.find(item => item.id == articleId);
                if (article) {
                    renderDetailView(article);
                    return;
                }
            }
            renderMainLayout(allArticles);
        }

        function goHome() {
            try {
                window.history.pushState({}, '', window.location.pathname);
            } catch (e) {}
            currentCategory = 'All';
            renderMainLayout(allArticles);
        }

        function viewArticle(id) {
            try {
                window.history.pushState({}, '', `?id=${id}`);
            } catch (e) {}
            const article = allArticles.find(item => item.id == id);
            if (article) renderDetailView(article);
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderMainLayout(allArticles);
        }

        // 渲染列表页
        function renderMainLayout(articles) {
            const categories = ['All', ...new Set(articles.map(item => item.category))];
            const filteredArticles = currentCategory === 'All' 
                ? articles 
                : articles.filter(item => item.category === currentCategory);

            const container = document.getElementById('app-view');
            container.innerHTML = `
                <div class="mb-8 border-b border-sand pb-6">
                    <h1 class="font-display text-4xl font-bold tracking-tight text-ink mb-2">Curated Insights</h1>
                    <p class="text-sage text-sm font-sans">深度剖析全球顶级外刊，提炼核心词汇与长难句逻辑结构。</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                    <!-- 左侧边栏：分类导航 -->
                    <aside class="lg:col-span-1 space-y-2">
                        <h3 class="text-xs font-sans uppercase tracking-widest text-sage mb-3 px-3 font-semibold">文章分类</h3>
                        <nav class="flex flex-row lg:flex-col gap-1.5 overflow-x-auto pb-2 lg:pb-0">
                            ${categories.map(cat => `
                                <button onclick="filterCategory('${cat}')" class="category-btn ${currentCategory === cat ? 'active' : 'bg-white text-ink hover:bg-sand/50'} text-left px-4 py-2.5 rounded-lg text-sm font-sans font-medium border border-sand transition-all whitespace-nowrap flex items-center justify-between">
                                    <span>${cat === 'All' ? '全部文章' : cat}</span>
                                    <span class="text-xs opacity-60">(${cat === 'All' ? articles.length : articles.filter(i => i.category === cat).length})</span>
                                </button>
                            `).join('')}
                        </nav>
                    </aside>

                    <!-- 右侧：文章列表网格 -->
                    <div class="lg:col-span-3">
                        ${filteredArticles.length === 0 ? `
                            <div class="bg-white border border-sand rounded-xl p-10 text-center text-sage">
                                该分类下暂无文章。
                            </div>
                        ` : `
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${filteredArticles.map(item => `
                                    <article onclick="viewArticle(${item.id})" class="bg-white border border-sand p-6 rounded-lg shadow-sm hover:shadow-md transition-all flex flex-col justify-between cursor-pointer group">
                                        <div>
                                            <div class="flex items-center justify-between text-xs text-sage mb-3 font-sans uppercase tracking-wider">
                                                <span class="bg-wheat px-2 py-0.5 rounded text-moss font-semibold">${item.category}</span>
                                                <span>${item.date}</span>
                                            </div>
                                            <h2 class="font-display text-xl font-bold text-ink mb-1 group-hover:text-moss transition-colors leading-snug">${item.title}</h2>
                                            <h3 class="text-sm text-sage font-serif mb-4">${item.chineseTitle}</h3>
                                            <p class="text-sm text-gray-600 line-clamp-3 mb-4 font-serif">${item.summary || ""}</p>
                                        </div>
                                        <div class="pt-4 border-t border-sand/60 flex items-center justify-between text-xs text-moss font-sans font-semibold">
                                            <span>精读文章</span>
                                            <span class="group-hover:translate-x-1 transition-transform">阅读解析 &rarr;</span>
                                        </div>
                                    </article>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // 渲染详情页（已加入冒泡阻断与移动端点击关闭）
        function renderDetailView(article) {
            const container = document.getElementById('app-view');
            container.innerHTML = `
                <button onclick="goHome()" class="mb-6 inline-flex items-center text-xs font-sans text-sage hover:text-ink font-semibold uppercase tracking-wider">
                    &larr; 返回文章列表
                </button>
                <div class="bg-white border border-sand rounded-xl p-8 md:p-12 shadow-sm max-w-4xl mx-auto">
                    <div class="flex items-center space-x-3 text-xs text-sage mb-4 font-sans uppercase tracking-wider">
                        <span class="bg-wheat px-2.5 py-1 rounded text-moss font-semibold">${article.category}</span>
                        <span>${article.date}</span>
                    </div>
                    <h1 class="font-display text-3xl md:text-4xl font-bold text-ink mb-2 leading-tight">${article.title}</h1>
                    <h2 class="text-lg text-sage font-serif mb-8 pb-6 border-b border-sand">${article.chineseTitle}</h2>
                    <p class="text-base text-gray-700 mb-10 italic bg-wheat/40 p-5 rounded-lg border-l-4 border-moss font-serif">${article.summary}</p>

                    <!-- 段落列表渲染 -->
                    <div class="space-y-12">
                        ${article.paragraphs.map((p, index) => `
                            <div class="p-6 md:p-8 bg-paper/50 border border-sand rounded-xl space-y-6 shadow-xs">
                                <div>
                                    <span class="text-xs font-sans font-bold uppercase tracking-widest text-moss bg-wheat px-2.5 py-1 rounded">Paragraph ${index + 1}</span>
                                    <h3 class="font-display text-xl font-bold text-ink mt-3">${p.paragraphTitle}</h3>
                                    <p class="text-sm text-sage mt-1 font-sans leading-relaxed"><strong>段落立论功能：</strong>${p.thesisAndContext}</p>
                                </div>

                                <!-- 原文与翻译区 -->
                                <div class="space-y-3 font-serif text-lg leading-relaxed text-gray-900 border-l-2 border-gold pl-4 py-1">
                                    <div class="font-semibold text-ink flex flex-wrap items-baseline">
                                        ${p.wordTokens && p.wordTokens.length > 0 ? p.wordTokens.map(token => `
                                            <span class="token-item" onclick="toggleToken(event, this)">
                                                ${token.word}
                                                <span class="tooltip-text" onclick="event.stopPropagation()">
                                                    <span class="flex justify-between items-center mb-1.5 pb-1 border-b border-sand/20">
                                                        <strong class="text-gold">成分分析</strong>
                                                        <button type="button" onclick="closeCurrentToken(event, this)" class="text-base text-sand/70 hover:text-white px-2 py-0.5 -mr-1 leading-none font-bold select-none">&times;</button>
                                                    </span>
                                                    <div class="space-y-1">
                                                        <div><strong class="text-sand">成分：</strong>${token.role}</div>
                                                        <div><strong class="text-sand">释义：</strong>${token.meaning}</div>
                                                    </div>
                                                </span>
                                            </span>
                                        `).join(' ') : `<p>${p.englishText}</p>`}
                                    </div>
                                    <p class="text-gray-600 text-base mt-2">${p.chineseText}</p>
                                </div>

                                <!-- 逐句语法拆解 -->
                                ${p.syntaxBreakdown && p.syntaxBreakdown.length > 0 ? `
                                    <div class="bg-white p-5 rounded-lg border border-sand text-sm font-sans space-y-3">
                                        <h4 class="font-bold text-moss flex items-center space-x-1.5">
                                            <span>🔍 逐句语法成分与词义精准拆解</span>
                                        </h4>
                                        <div class="divide-y divide-sand/60">
                                            ${p.syntaxBreakdown.map(sb => `
                                                <div class="py-3 space-y-1">
                                                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-1">
                                                        <span class="font-serif text-ink font-medium">${sb.part}</span>
                                                        <span class="text-xs px-2 py-0.5 bg-wheat text-moss rounded font-semibold whitespace-nowrap self-start md:self-auto">${sb.role}</span>
                                                    </div>
                                                    ${sb.detail ? `
                                                        <div class="text-xs text-sage font-sans pl-2 border-l-2 border-gold/60 mt-1">
                                                            💡 <strong>词义/用法剖析：</strong> ${sb.detail}
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}

                                <!-- 核心句式与主干提取 -->
                                ${p.sentenceAnalysis ? `
                                    <div class="bg-white p-5 rounded-lg border border-sand text-sm font-sans space-y-2">
                                        <h4 class="font-bold text-ink flex items-center space-x-1.5">
                                            <span>📊 核心句式与主干提取</span>
                                        </h4>
                                        <div class="text-gray-700 leading-relaxed">${p.sentenceAnalysis}</div>
                                    </div>
                                ` : ''}

                                <!-- 核心高阶词汇总结 -->
                                ${p.vocabularyNotes && p.vocabularyNotes.length > 0 ? `
                                    <div class="bg-wheat/30 p-5 rounded-lg border border-sand/60 text-sm font-sans space-y-3">
                                        <h4 class="font-bold text-moss flex items-center space-x-1.5">
                                            <span>💡 段落核心高阶词汇总结</span>
                                        </h4>
                                        <ul class="grid grid-cols-1 gap-2.5">
                                            ${p.vocabularyNotes.map(v => `
                                                <li class="bg-white p-3 rounded border border-sand/40">
                                                    <span class="font-bold text-ink">${v.term}:</span> 
                                                    <span class="text-gray-700">${v.explanation}</span>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 切换词元气泡激活状态
        function toggleToken(event, element) {
            if (event) event.stopPropagation();
            const isActive = element.classList.contains('active');
            closeAllTokens();
            if (!isActive) {
                element.classList.add('active');
            }
        }

        // 点击右上角 × 彻底阻断冒泡并关闭当前气泡
        function closeCurrentToken(event, btn) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const tokenItem = btn.closest('.token-item');
            if (tokenItem) {
                tokenItem.classList.remove('active');
            }
        }

        // 关闭所有已打开的气泡
        function closeAllTokens() {
            document.querySelectorAll('.token-item.active').forEach(item => {
                item.classList.remove('active');
            });
        }

        // 点击屏幕任意空白处自动收起已打开的气泡
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.token-item')) {
                closeAllTokens();
            }
        });

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
